{{- /*
Controller (web UI) credentials.

Two things were wrong before:

  1. This Secret and the StatefulSet's RSPAMD_PASSWORD env were both gated on
     `.Values.webui.password`, which ships empty — so the default install
     rendered neither and the controller was deployed with no credential of the
     chart's choosing at all.

  2. RSPAMD_PASSWORD would not have worked anyway: the rspamd/rspamd image does
     not read it (there is no reference to the name anywhere in the image), so
     the operator's password never reached Rspamd and the controller kept the
     stock worker-controller.inc that ships inside the image — bound to *:11334
     with the sample password from Rspamd's own example config.

So this Secret now carries the whole controller worker snippet, which the
StatefulSet mounts over /etc/rspamd/local.d/worker-controller.inc. That is the
same file the Compose path generates, and it is the only mechanism Rspamd
actually honours.

Password precedence mirrors templates/thunder-admin-secret.yaml in the parent
chart: an explicit webui.password wins; otherwise the value already in the
cluster is reused so upgrades do not rotate it; otherwise one is generated.

⚠️  `lookup` returns nothing without a cluster connection, so `helm template` /
`--dry-run` emits a FRESH random password every render. Set webui.password
explicitly for render-then-apply (GitOps) workflows.
*/}}
{{- $name := include "rspamd.webuiSecretName" . }}
{{- $password := .Values.webui.password }}
{{- if not $password }}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
  {{- $existingData := dict }}
  {{- if $existing }}
    {{- $existingData = $existing.data | default dict }}
  {{- end }}
  {{- if index $existingData "password" }}
    {{- $password = index $existingData "password" | b64dec }}
  {{- else }}
    {{- $password = randAlphaNum 32 }}
  {{- end }}
{{- end }}
{{- /* Privileged actions (learn spam/ham, fuzzy add/delete, config write) are
guarded by enable_password. Rspamd recommends a secret distinct from the
read-only one; when webui.enablePassword is unset we reuse the read-only
password, which is the single-admin trust model and is still a real credential.
It must never be the boolean `true` — that is not a password at all. */}}
{{- $enablePassword := .Values.webui.enablePassword | default $password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "rspamd.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Read back with:
  #   kubectl get secret {{ $name }} -o jsonpath='{.data.password}' | base64 -d
  password: {{ $password | quote }}
  enable-password: {{ $enablePassword | quote }}
  # Mounted at /etc/rspamd/local.d/worker-controller.inc. Passwords are plaintext
  # because Rspamd's hash format (catena/PBKDF2, produced by `rspamadm pw`) cannot
  # be computed by Helm at render time. They are no more exposed than the Secret
  # itself, which the pod must be able to read either way; hashing them would need
  # an init container running `rspamadm pw`, which is left as a follow-up.
  worker-controller.inc: |
    # 0.0.0.0 is correct in a pod: the network namespace holds only lo and eth0,
    # and the kubelet's liveness probe dials the pod IP. Reachability is governed
    # by templates/networkpolicy.yaml, not by the bind address.
    bind_socket = "0.0.0.0:{{ .Values.service.webui.targetPort }}";
    count = 1;
    password = {{ $password | quote }};
    enable_password = {{ $enablePassword | quote }};
