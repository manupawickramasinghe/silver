apiVersion: v1
kind: Pod
metadata:
  name: {{ include "rspamd.fullname" . }}-test
  labels:
    helm.sh/chart: {{ include "rspamd.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    # This used to claim app.kubernetes.io/name: smtp to satisfy the
    # NetworkPolicy's milter ingress rule. No workload in the release carries
    # that label — the test pod was the only thing that did — so the test passed
    # while Postfix itself was being blocked. It now borrows Postfix's real
    # labels, which is the path that has to work in production.
    app.kubernetes.io/name: postfix
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: test-connectivity
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
      command:
        - /bin/bash
        - -c
        - |
          echo "Testing Rspamd milter connectivity on port {{ .Values.service.milter.port }}..."
          if timeout 2 bash -c "echo > /dev/tcp/{{ include "rspamd.serviceName" . }}/{{ .Values.service.milter.port }}" >/dev/null 2>&1; then
            echo "✓ Milter port {{ .Values.service.milter.port }} is reachable"
          else
            echo "✗ Milter port {{ .Values.service.milter.port }} is NOT reachable"
            exit 1
          fi

          {{- if and .Values.service.webui.enabled (not .Values.networkPolicy.enabled) }}
          # Skipped when the NetworkPolicy is on: the controller has no default
          # ingress rule, so a test pod is supposed to be unable to reach it.
          echo "Testing Rspamd Web UI connectivity on port {{ .Values.service.webui.port }}..."
          if ! timeout 2 bash -c "echo > /dev/tcp/{{ include "rspamd.serviceName" . }}/{{ .Values.service.webui.port }}" >/dev/null 2>&1; then
            echo "✗ Web UI port {{ .Values.service.webui.port }} is NOT reachable"
            exit 1
          fi
          echo "✓ Web UI port {{ .Values.service.webui.port }} is reachable"

          # The controller can whitelist senders, retrain Bayes and rewrite the
          # running config, so an unauthenticated 200 here is a security failure,
          # not a connectivity success.
          echo "Checking that the controller rejects unauthenticated requests..."
          status=$(exec 3<>/dev/tcp/{{ include "rspamd.serviceName" . }}/{{ .Values.service.webui.port }} \
            && printf 'GET /stat HTTP/1.0\r\nConnection: close\r\n\r\n' >&3 \
            && head -n 1 <&3)
          echo "  controller replied: ${status}"
          case "$status" in
            *401*) echo "✓ Controller demands a password" ;;
            *) echo "✗ Controller answered /stat without credentials"; exit 1 ;;
          esac
          {{- end }}

          echo "All Rspamd connectivity tests passed!"
  restartPolicy: Never
