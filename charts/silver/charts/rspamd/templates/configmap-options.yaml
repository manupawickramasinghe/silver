apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rspamd.fullname" . }}-config-options
  labels:
    {{- include "rspamd.labels" . | nindent 4 }}
data:
  options.inc: |
    dns {
      nameserver = ["{{ include "rspamd.unboundHost" . }}"];
      timeout = 1s;
      sockets = 16;
    }

  redis.conf: |
    servers = "{{ include "rspamd.redisHost" . }}:{{ .Values.dependencies.redis.port }}";
    timeout = 1s;
