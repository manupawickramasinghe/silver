{{- /*
Governing Service for the StatefulSet.

statefulset.yaml used to set `serviceName: <release>-rspamd`, but the only
Service the chart creates is the release-independent `rspamd` (see
service.yaml). A StatefulSet's governing Service must exist and be headless for
stable per-pod DNS to resolve, so that name pointed at nothing and
<pod>.<service> never resolved — the main reason to use a StatefulSet at all.
Harmless at replicaCount: 1, broken on scale.

Kept separate from `rspamd` so that Service can stay a normal ClusterIP: it is
the one Postfix dials, and vendored configs reference it by that fixed name.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rspamd.headlessServiceName" . }}
  labels:
    {{- include "rspamd.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - port: {{ .Values.service.milter.port }}
      targetPort: {{ .Values.service.milter.targetPort }}
      protocol: TCP
      name: milter
    - port: {{ .Values.service.webui.port }}
      targetPort: {{ .Values.service.webui.targetPort }}
      protocol: TCP
      name: webui
  selector:
    {{- include "rspamd.selectorLabels" . | nindent 4 }}
