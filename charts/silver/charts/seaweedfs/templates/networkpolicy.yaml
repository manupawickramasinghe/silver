{{- if .Values.networkPolicy.enabled }}
{{/*
Ingress restriction for the attachment store. Modelled on the opendkim subchart's
policy (same enabled gate / allowedIngressFrom values key).

Without this, every pod in the cluster can reach the master API on 9333/19333,
which has no authentication at all, and read or delete raw attachment blobs
without ever presenting the S3 credential. Splitting the master onto its own
Service (service-master.yaml) removes it from the S3 Service, but Services are
not a security boundary — this is.

Two rules, deliberately asymmetric:
  1. S3 (8333): raven only, plus any extra peers in allowedIngressFrom.
  2. Everything else: only pods carrying seaweedfs's own selector labels — which
     is exactly the bucket-init Job and the helm test Pod (they run from this
     chart and inherit those labels), plus the store itself.

Rule 2 intentionally does NOT list 9333/19333. `weed shell` first talks master
gRPC, then dials the FILER and VOLUME gRPC ports directly on the advertised pod
IP (see the -ip=$(POD_IP) flag in statefulset.yaml), so narrowing it to the two
master ports would break bucket creation.

Kubelet probes originate from the node, not a pod. Most CNIs allow node-sourced
traffic; if yours does not, the S3 tcpSocket probes will fail and you will need
an extra ipBlock rule for the node CIDR.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "seaweedfs.fullname" . }}
  labels:
    {{- include "seaweedfs.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "seaweedfs.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # 1. S3 gateway.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.networkPolicy.clientPodName }}
              app.kubernetes.io/instance: {{ .Release.Name }}
{{- with .Values.networkPolicy.allowedIngressFrom }}
{{ toYaml . | indent 8 }}
{{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.s3Port }}
    # 2. Master/filer/volume, for this chart's own Job and test Pod.
    - from:
        - podSelector:
            matchLabels:
              {{- include "seaweedfs.selectorLabels" . | nindent 14 }}
{{- end }}
