apiVersion: v1
kind: Service
metadata:
  # Stable, release-independent name so Raven's config resolves the S3 endpoint.
  name: {{ include "seaweedfs.serviceName" . }}
  labels:
    {{- include "seaweedfs.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  # S3 gateway ONLY. The master HTTP/gRPC API used to share this Service; it has
  # no authentication of any kind (s3-config.json gates the S3 gateway, nothing
  # else), so anything that could resolve seaweedfs-s3 could enumerate volumes
  # and read or delete raw attachment blobs without ever presenting the S3
  # credential. The master now lives on its own headless Service — see
  # service-master.yaml — reached only by the bucket-init Job and the helm test.
  ports:
    - name: s3
      port: {{ .Values.service.s3Port }}
      targetPort: s3
      protocol: TCP
  selector:
    {{- include "seaweedfs.selectorLabels" . | nindent 4 }}
