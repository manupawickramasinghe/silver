# Default values for the seaweedfs subchart.
# Single-node SeaweedFS exposing an S3-compatible API for Raven attachment storage.

replicaCount: 1

image:
  repository: chrislusf/seaweedfs
  # Overrides the image tag; defaults to the chart appVersion (":latest").
  tag: ""
  # appVersion is the floating ":latest" tag, so Always avoids nodes pinning a
  # stale cached image. Pin a version/digest in prod and switch to IfNotPresent.
  pullPolicy: Always

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

# chrislusf/seaweedfs runs as root by default and writes to /data. fsGroup keeps
# the PVC group-writable; override runAsUser/runAsNonRoot once the image is
# confirmed to run unprivileged.
podSecurityContext:
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

# Deployment mode.
#   combined: one process via `weed server -s3` (default; lazy path).
#   Fallback: if the pod crash-loops on startup OR S3/bucket ops fail against
#   combined mode, switch to the 4-role split (mirror docker-compose.seaweedfs.yaml).
#   See README "Deployment mode" for the trigger.
mode: combined

service:
  # ClusterIP only — internal storage, never publicly exposed.
  type: ClusterIP
  # S3 gateway port Raven writes to. The only port on the seaweedfs-s3 Service.
  s3Port: 8333
  # Master HTTP port. On its own headless Service (<release>-seaweedfs-master)
  # for the bucket-init Job / helm test, NOT on the S3 Service: the master API is
  # unauthenticated and would otherwise bypass the S3 identity. Not consumed by
  # Raven.
  masterPort: 9333
  # Master gRPC port (= masterPort + 10000). `weed shell` actually talks gRPC,
  # so this MUST be reachable or shell commands silently no-op. Filer/volume
  # gRPC are reached via the advertised pod IP (routable), so only master gRPC
  # needs Service exposure.
  masterGrpcPort: 19333
  annotations: {}

# S3 credentials + identity.
#
# secretKey "" => this chart GENERATES a random key on first install and reuses
# whatever is already in the cluster thereafter (a `lookup` guard reads the
# existing Secret), so upgrades never rotate it. Raven does not recompute the key
# — it reads this chart's Secret via secretKeyRef. It used to be derived from the
# release name so both charts could compute it, which made every default
# install's S3 admin key offline-computable by anyone.
#
# Set global.s3.secretKey explicitly in prod, and always for GitOps /
# `helm template | kubectl apply`, where `lookup` sees no cluster and each render
# would emit a new random key.
s3:
  accessKey: raven
  secretKey: ""
  bucket: email-attachments
  region: us-east-1
  identityName: raven

# Ingress restriction for the attachment store. Off by default to match the
# opendkim subchart, but recommended: without it any pod in the cluster can reach
# the UNAUTHENTICATED master API on 9333/19333 and read or delete raw attachment
# blobs, bypassing the S3 credential entirely.
networkPolicy:
  enabled: false
  # app.kubernetes.io/name of the S3 client allowed to reach 8333. Must match the
  # raven subchart's pod labels (its nameOverride, default the chart name).
  clientPodName: raven
  # Extra peers allowed to reach 8333, ADDED to the raven selector above (not a
  # replacement, so enabling the policy cannot accidentally lock raven out).
  # Example:
  # allowedIngressFrom:
  #   - namespaceSelector:
  #       matchLabels:
  #         kubernetes.io/metadata.name: mail
  #     podSelector:
  #       matchLabels:
  #         app.kubernetes.io/name: some-other-client
  allowedIngressFrom: []

persistence:
  # Empty => cluster default StorageClass. Clusters without a default
  # (OpenShift, some k3d setups) MUST set this or the PVC stays Pending.
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi
  mountPath: /data

# Combined mode is memory-hungry (master+volume+filer+s3 in one process).
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

# Probes target the S3 gateway. It answers HTTP on 8333; a 403 (auth required)
# still proves liveness, so we probe the port over TCP to avoid auth noise.
livenessProbe:
  tcpSocket:
    port: s3
  initialDelaySeconds: 20
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  tcpSocket:
    port: s3
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Auto-create the bucket for determinism/observability. SeaweedFS also
# auto-creates on first PUT (the identity has Admin), so this is belt-and-braces.
bucketInit:
  enabled: true

nodeSelector: {}
tolerations: []
affinity: {}
