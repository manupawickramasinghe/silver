# Default values for the raven subchart.
# Raven serves IMAP (143/993), LMTP (24), SASL admin (12345) and a socketmap
# lookup server (9100) for Postfix. Config + certs come from rendered Secrets
# (the raw manifests used hostPath — not portable).

replicaCount: 1

image:
  repository: ghcr.io/lsflk/raven
  # Defaults to appVersion, now a released tag rather than "latest". Pinning
  # matters more here than anywhere else in the stack: a pod restart used to be
  # able to swap the IMAP server binary, and rollback was impossible.
  # v0.7.0 == the digest :latest pointed at when this was pinned
  # (sha256:650b8008d18ca782ae300fba928445bca6e35cdc93d3f03816735a5912fe77dd).
  # For full immutability set tag to that digest instead.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

# Raven's upstream image expects to bind low ports and manage /app/data as root.
#
# UID 0 is retained deliberately. Raven binds 143/993/24 and owns /app/data, and
# the compose deployment additionally relies on root because the config generator
# writes root-owned files into the mounted config directory. De-rooting needs that
# ownership fixed first, so it is left as follow-up rather than half-done here.
#
# What UID 0 costs is bounded instead. Without capabilities.drop a root container
# holds the full default set — CAP_DAC_OVERRIDE, CAP_SYS_CHROOT, CAP_SETUID and the
# rest — on the single most exposed workload in the cluster: raven terminates IMAP
# and SASL for external clients and can take hostPort 143/993. Dropping to just
# NET_BIND_SERVICE removes almost all of that while keeping the low-port bind.
#
# Applied to every container, including the init-db-dir and render-config init
# containers (see templates/deployment.yaml).
podSecurityContext: {}
securityContext:
  runAsUser: 0
  runAsGroup: 0
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE
  seccompProfile:
    type: RuntimeDefault
  # Deliberately false, matching the rspamd chart. Raven's writable paths beyond
  # the mounted volumes have not been established, and a mail server that cannot
  # write is worse than one with a writable root filesystem. Revisit with a real
  # deployment to confirm what it touches outside /app/data and /etc/raven.
  readOnlyRootFilesystem: false

service:
  # ClusterIP for in-cluster bring-up. Public mail needs LoadBalancer or hostPort
  # (real client IP for spam scoring) — switch per environment.
  type: ClusterIP
  annotations: {}

# Bind imap/imaps (143/993) on the node so external mail clients can reach them.
# Single-node only (one pod per host port). Mirrors postfix.hostPort.
hostPort:
  enabled: false

# Listener ports. socketmap (9100) is what Postfix queries for user/alias lookups.
ports:
  imap: 143
  imaps: 993
  lmtp: 24
  sasl: 12345
  socketmap: 9100

persistence:
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 5Gi
  mountPath: /app/data

# TLS for IMAPS (993). enabled + no existingSecret => the chart generates a
# stable self-signed cert (kept across upgrades). Point existingSecret at the
# cert-manager Secret (<domain>-tls) in prod.
tls:
  enabled: true
  existingSecret: ""
  # Set true when existingSecret is a cert-manager Secret (tls.crt/tls.key): the mount
  # remaps those keys to the fullchain.pem/privkey.pem filenames Raven expects, so the
  # cert-manager Secret can be used directly (auto-renews). Leave false for the chart's
  # self-signed Secret or a secret already using fullchain.pem/privkey.pem.
  certManagerKeys: false
  mountPath: /certs

# Thunder auth backend (external — not charted here). Raven starts without it;
# only IMAP/SASL login fails until Thunder is reachable at these addresses.
thunder:
  # Both default to the bare <global.domain>. Thunder serves the <domain>
  # certificate on :8090 and publishes its issuer as https://<domain>:8090, so
  # mail.<domain> and the in-cluster Service name are not SANs and raven (which
  # cannot skip TLS verification) would fail against either.
  host: ""           # default <domain>
  port: 8090
  # Public issuer/JWKS host for OAuth token validation (JWT iss must match).
  publicHost: ""     # default <domain>
  publicPort: 8090
  audience: EMAIL_APP
  # Raven otherwise tries to read the app ID from `docker logs thunder-setup`
  # (a compose-only hack needing the docker socket). Set this to skip that path.
  # Empty is fine without Thunder — the group resolver just fails gracefully.
  applicationId: ""
  # System identity raven uses to obtain a system-scoped assertion for OU->domain
  # resolution during login (IDP_SYSTEM_USERNAME / IDP_SYSTEM_PASSWORD; raven defaults
  # admin/admin). Needs a user with system:ou:view (the bootstrap admin). Password is
  # read from a Secret so it isn't committed.
  systemUsername: ""           # e.g. admin
  systemPasswordSecret: ""     # Secret name holding the admin password
  systemPasswordSecretKey: password

# S3-compatible blob storage for attachments. Defaults wire to the in-cluster
# seaweedfs subchart. Credentials come from global.s3.* (shared with seaweedfs);
# these local values are only fallbacks. secretKey "" => derived deterministically
# from the release name, matching seaweedfs.
blobStorage:
  enabled: true
  endpoint: ""       # default http://<global.serviceNames.s3>:8333
  region: us-east-1
  bucket: email-attachments
  accessKey: raven
  secretKey: ""

# delivery.yaml knobs.
delivery:
  defaultFolder: INBOX
  quotaEnabled: false
  quotaLimit: 1073741824
  rejectUnknownUser: false
  logLevel: info      # base config ships "debug"

env:
  cacheTtlSeconds: 300
  tokenRefreshSeconds: 3300

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  tcpSocket:
    port: imap
  initialDelaySeconds: 15
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  tcpSocket:
    port: imap
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}
