apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "raven.fullname" . }}
  labels:
    {{- include "raven.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Single writer to the RWO data PVC; never roll a second pod onto it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "raven.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Note: the config Secret no longer carries the S3 secret key (it holds a
        # placeholder the render-config init container fills in), so this checksum
        # does not change when that key rotates. Restart raven after rotating it.
        checksum/config: {{ include (print $.Template.BasePath "/secret-config.yaml") . | sha256sum }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "raven.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Raven's DB_FILE lives under /app/data/databases; ensure the dir exists
        # on the fresh PVC (compose seeded it via a host script).
        - name: init-db-dir
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c", "mkdir -p {{ .Values.persistence.mountPath }}/databases"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
        # Raven takes its S3 credential from raven.yaml/delivery.yaml, not from
        # the environment, so a secretKeyRef cannot reach it directly. The config
        # Secret ships a placeholder; this substitutes the real key — generated
        # once by the seaweedfs subchart — into a private in-memory copy of the
        # config. Consequence: the S3 key lives only in the seaweedfs Secret, and
        # a one-command install works because the reference is resolved by the
        # kubelet at pod start, after Helm has applied that Secret.
        - name: render-config
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if and .Values.blobStorage.enabled (not (include "raven.s3SecretKeyExplicit" .)) }}
          env:
            - name: SILVER_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "raven.s3SecretName" . }}
                  key: {{ include "raven.s3SecretKeyRefKey" . }}
                  # Fail the pod rather than start Raven with an empty S3 key.
                  optional: false
          {{- end }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              for f in raven.yaml delivery.yaml; do
                # awk reads the key from ENVIRON so it never appears in argv.
                # index/substr rather than gsub: gsub would interpret & and \ in
                # the replacement. Building the output left-to-right also cannot
                # loop if the key itself ever contained the placeholder.
                awk '
                  BEGIN { k = ENVIRON["SILVER_S3_SECRET_KEY"]; p = "{{ include "raven.s3SecretKeyPlaceholder" . }}" }
                  {
                    out = ""; rest = $0
                    while ((i = index(rest, p)) > 0) {
                      out = out substr(rest, 1, i - 1) k
                      rest = substr(rest, i + length(p))
                    }
                    print out rest
                  }
                ' "/etc/raven-src/$f" >"/etc/raven/$f"
                chmod 600 "/etc/raven/$f"
              done
          volumeMounts:
            - name: config
              mountPath: /etc/raven-src
              readOnly: true
            - name: config-rendered
              mountPath: /etc/raven
      containers:
        - name: raven
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: DB_FILE
              value: {{ .Values.persistence.mountPath }}/databases/shared.db
            - name: SOCKETMAP_HOST
              value: "0.0.0.0"
            - name: SOCKETMAP_PORT
              value: {{ .Values.ports.socketmap | quote }}
            - name: THUNDER_HOST
              value: {{ include "raven.thunderHost" . | quote }}
            - name: THUNDER_PORT
              value: {{ .Values.thunder.port | quote }}
            {{- if .Values.thunder.applicationId }}
            - name: APPLICATION_ID
              value: {{ .Values.thunder.applicationId | quote }}
            {{- end }}
            {{- if .Values.thunder.systemUsername }}
            - name: IDP_SYSTEM_USERNAME
              value: {{ .Values.thunder.systemUsername | quote }}
            {{- end }}
            {{- if .Values.thunder.systemPasswordSecret }}
            - name: IDP_SYSTEM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.thunder.systemPasswordSecret }}
                  key: {{ .Values.thunder.systemPasswordSecretKey | default "password" }}
            {{- end }}
            - name: CACHE_TTL_SECONDS
              value: {{ .Values.env.cacheTtlSeconds | quote }}
            - name: TOKEN_REFRESH_SECONDS
              value: {{ .Values.env.tokenRefreshSeconds | quote }}
          ports:
            # imap/imaps bind hostPort so external mail clients reach them on the
            # node IP (single-node, one pod per host port). Mirrors postfix.
            - name: imap
              containerPort: {{ .Values.ports.imap }}
              {{- if .Values.hostPort.enabled }}
              hostPort: {{ .Values.ports.imap }}
              {{- end }}
            - name: imaps
              containerPort: {{ .Values.ports.imaps }}
              {{- if .Values.hostPort.enabled }}
              hostPort: {{ .Values.ports.imaps }}
              {{- end }}
            - {name: lmtp,      containerPort: {{ .Values.ports.lmtp }}}
            - {name: sasl,      containerPort: {{ .Values.ports.sasl }}}
            - {name: socketmap, containerPort: {{ .Values.ports.socketmap }}}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            # Populated by the render-config init container, not mounted from
            # the config Secret directly.
            - name: config-rendered
              mountPath: /etc/raven
              readOnly: true
            {{- if .Values.tls.enabled }}
            - name: certs
              mountPath: {{ .Values.tls.mountPath }}
              readOnly: true
            {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "raven.fullname" . }}-data
        - name: config
          secret:
            secretName: {{ include "raven.configSecretName" . }}
        # medium: Memory keeps the substituted S3 key off the node's disk.
        - name: config-rendered
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        {{- if .Values.tls.enabled }}
        - name: certs
          secret:
            secretName: {{ include "raven.certSecretName" . }}
            {{- if .Values.tls.certManagerKeys }}
            # Remap cert-manager's tls.crt/tls.key to the fullchain.pem/privkey.pem
            # filenames Raven expects, so a cert-manager Secret can be mounted directly
            # (auto-renews; no hand-copied secret).
            items:
              - key: tls.crt
                path: fullchain.pem
              - key: tls.key
                path: privkey.pem
            {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
