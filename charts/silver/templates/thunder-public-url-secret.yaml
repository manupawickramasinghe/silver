{{- if .Values.thunder.enabled }}
{{- /*
THUNDER_PUBLIC_URL for the Thunder setup job, derived from global.domain.

Why a Secret for a value that is not secret. The bootstrap script registers the
CONSOLE app's redirect URI as ${THUNDER_PUBLIC_URL}/console, so this MUST equal
thunder.configuration.server.publicUrl or console login fails with "Invalid
redirect URI". It therefore has to track global.domain.

The vendored Thunder subchart offers exactly one way to inject a value the umbrella
computes: setup.secretEnv, which renders a secretKeyRef. setup.env is passed through
`toYaml` with no `tpl`, and the job's container declares no `envFrom`, so anything
placed there can only ever be a hand-written literal — which is what previously
shipped as `value: ""` and made the documented install command fail to render.

This mirrors templates/thunder-admin-secret.yaml: same delivery mechanism, same
hook weight ordering. The Secret carrier is a limitation of the vendored chart's
interface, not a claim that the URL is sensitive. It stops being necessary once the
thunderid chart migration lets these values be derived directly (see charts/PLAN.md),
at which point this file and domain-guard.yaml go away together.
*/}}
{{- $name := (((.Values.global).thunderPublicUrl).secretName) | default "silver-thunder-public-url" }}
{{- $key := (((.Values.global).thunderPublicUrl).secretKey) | default "publicUrl" }}
{{- $expectedUrl := printf "https://%s:8090" (include "silver.domain" .) }}

{{- /* The Secret is useless if the setup job looks for a different name. Values files
     can't be templated, so these are separate literals — check them rather than let a
     mismatch surface as a pod stuck in CreateContainerConfigError. Mirrors the same
     check in thunder-admin-secret.yaml. */}}
{{- range (((.Values.thunder).setup).secretEnv | default list) }}
  {{- if and (eq .name "THUNDER_PUBLIC_URL") (ne .secretName $name) }}
    {{- fail (printf "thunder.setup.secretEnv THUNDER_PUBLIC_URL secretName (%s) must equal global.thunderPublicUrl.secretName (%s)" .secretName $name) }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "silver.labels" . | nindent 4 }}
    app.kubernetes.io/component: thunder-public-url
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    # Below the setup job's -5 so the value exists before the job reads it.
    "helm.sh/hook-weight": "-6"
    # Lets a reinstall recreate it instead of failing "already exists". Unlike the
    # admin password this is derived, not generated, so recreating is lossless.
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
data:
  {{ $key }}: {{ $expectedUrl | b64enc | quote }}
{{- end }}
