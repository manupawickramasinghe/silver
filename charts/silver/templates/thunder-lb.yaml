{{- if and .Values.thunder.enabled ((((.Values.global).thunderLb).enabled) | default true) }}
{{- /*
LoadBalancer Service exposing Thunder on the node's :8090.

The vendored asgardeo Thunder chart's own Service is hardcoded ClusterIP, but Thunder's
OAuth issuer/JWKS is published at https://<domain>:8090 — reachable by BOTH raven
(in-cluster JWKS fetch) and the external mail client (OAuth token endpoint). On k3s,
klipper/servicelb binds this port on the node (firewall already opens 8090).

Name is release-independent, matching the global.serviceNames convention used by
raven/rspamd/opendkim/postfix, so in-cluster references don't have to track the
release name.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ (((.Values.global).serviceNames).thunderLb) | default "thunder-lb" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "silver.labels" . | nindent 4 }}
spec:
  type: LoadBalancer
  {{- /*
  Port 8090 serves BOTH the public OAuth issuer/JWKS (which must stay reachable by
  external mail clients) and Thunder's CONSOLE admin UI plus its management REST API
  (/users, /organization-units, /applications). There is no path-level split here, so
  with no source restriction the identity server's admin surface is on the open
  internet, protected only by the admin password.

  Empty (the default) preserves the previous behaviour rather than silently breaking
  an existing deployment's OAuth. Restrict it wherever the client population is known:
    --set 'global.thunderLb.sourceRanges={203.0.113.0/24}'
  Set global.thunderLb.enabled=false to drop the Service entirely and front Thunder
  with an ingress that allowlists the public paths instead — the better end state,
  and the reason this is now opt-out.
  */}}
  {{- with (((.Values.global).thunderLb).sourceRanges) }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    app.kubernetes.io/name: thunder
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: https
      port: 8090
      targetPort: 8090
      protocol: TCP
{{- end }}
